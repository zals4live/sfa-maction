services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: maction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maction_secret}
      POSTGRES_DB: ${POSTGRES_DB:-maction_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maction} -d ${POSTGRES_DB:-maction_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - maction-network

  redis:
    image: redis:7-alpine
    container_name: maction-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maction-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  maction-network:
    driver: bridge
