# =============================================================================
# KF Maction v2.0 — Main Nginx Configuration
# =============================================================================
# Production reverse proxy for AWS EC2 (Ubuntu).
# Handles SSL termination, HTTP/2, compression, and WebSocket upstreaming.
#
# Installation:
#   1. Copy this file to /etc/nginx/nginx.conf
#   2. Copy conf.d/ to /etc/nginx/conf.d/
#   3. Copy snippets/ to /etc/nginx/snippets/maction/
#   4. Generate DH params: openssl dhparam -out /etc/nginx/dhparam.pem 4096
#   5. Obtain SSL certs: certbot certonly --nginx -d maction.kimiafarma.co.id ...
#   6. Test config: nginx -t
#   7. Reload: systemctl reload nginx
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # ---------- Basic Settings ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 15m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------- Logging ----------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ---------- Rate Limiting Zones ----------
    # General API rate limit: 100 req/min per user IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;

    # Auth endpoint rate limit: 5 req/min per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # S3 pre-signed URL generation: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=s3_upload:10m rate=30r/m;

    # ---------- Upstream Definitions ----------
    # REPLACE: Update ports to match your systemd service configurations

    upstream maction_api {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream maction_portal {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    upstream maction_pwa {
        server 127.0.0.1:3002;
        keepalive 16;
    }

    # ---------- Shared Includes ----------
    include /etc/nginx/snippets/maction/gzip.conf;

    # ---------- WebSocket Upgrade Map ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- Redirect HTTP → HTTPS (all domains) ----------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------- Server Blocks ----------
    include /etc/nginx/conf.d/*.conf;
}
