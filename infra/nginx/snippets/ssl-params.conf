# SSL/TLS Parameters
# Shared across all server blocks for consistent TLS configuration.
# Requires: certbot (Let's Encrypt) or ACM-managed certificates.

# TLS 1.3 only — maximum security for modern clients
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Strong cipher suite — TLS 1.3 ciphers are auto-negotiated;
# TLS 1.2 fallback uses ECDHE for forward secrecy
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

# Session resumption for performance
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP Stapling — reduces certificate validation latency for clients
ssl_stapling on;
ssl_stapling_verify on;

# Trusted CA certificate for OCSP stapling verification
# REPLACE: Path to your CA chain file (e.g., Let's Encrypt fullchain or intermediate)
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Diffie-Hellman parameter for DHE ciphers (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096)
# REPLACE: Generate this file on the production server
ssl_dhparam /etc/nginx/dhparam.pem;
