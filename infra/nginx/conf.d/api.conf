# =============================================================================
# KF Maction v2.0 — API Server (Elysia.js on Bun)
# =============================================================================
# Domain: api.maction.kimiafarma.co.id
# Upstream: maction_api (127.0.0.1:3000)
# Features: SSL, HTTP/2, WebSocket upgrade, rate limiting, CORS
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.maction.kimiafarma.co.id;

    # ---------- SSL Certificates ----------
    # REPLACE: Update paths to your actual Let's Encrypt or ACM certificates
    ssl_certificate /etc/letsencrypt/live/api.maction.kimiafarma.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.maction.kimiafarma.co.id/privkey.pem;

    include /etc/nginx/snippets/maction/ssl-params.conf;

    # ---------- Security Headers ----------
    include /etc/nginx/snippets/maction/security-headers.conf;

    # ---------- CORS Headers ----------
    # Restrict API access to known frontend origins only
    set $cors_origin "";
    if ($http_origin ~* "^https://(maction|admin\.maction)\.kimiafarma\.co\.id$") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Idempotency-Key" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age 86400 always;

    # ---------- Preflight (OPTIONS) ----------
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ---------- Auth Endpoints (Stricter Rate Limit) ----------
    location /auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_api;
    }

    # ---------- S3 Pre-signed URL Endpoints ----------
    location ~* ^/upload/ {
        limit_req zone=s3_upload burst=10 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_api;
    }

    # ---------- WebSocket Endpoint (Real-time Tracking) ----------
    location /ws/ {
        include /etc/nginx/snippets/maction/proxy-params.conf;

        proxy_pass http://maction_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket-specific timeouts (longer for persistent connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Health Check (No Rate Limit) ----------
    location = /health {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_api;
        access_log off;
    }

    # ---------- All Other API Routes ----------
    location / {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_api;
    }

    # ---------- Error Pages ----------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
