# =============================================================================
# KF Maction v2.0 — Field PWA (Nuxt 4 SSR + Workbox)
# =============================================================================
# Domain: maction.kimiafarma.co.id
# Upstream: maction_pwa (127.0.0.1:3002)
# Features: SSL, HTTP/2, Service Worker headers, PWA caching, gzip
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maction.kimiafarma.co.id;

    # ---------- SSL Certificates ----------
    # REPLACE: Update paths to your actual Let's Encrypt or ACM certificates
    ssl_certificate /etc/letsencrypt/live/maction.kimiafarma.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maction.kimiafarma.co.id/privkey.pem;

    include /etc/nginx/snippets/maction/ssl-params.conf;

    # ---------- Security Headers ----------
    include /etc/nginx/snippets/maction/security-headers.conf;

    # ---------- Service Worker ----------
    # The SW file must not be cached and must be served from root scope
    location = /sw.js {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # ---------- Web App Manifest ----------
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json";
    }

    # ---------- Workbox Precache Assets ----------
    location /workbox- {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        # Workbox chunk files are content-hashed — safe to cache long-term
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- Static Assets (Nuxt _nuxt/ build output) ----------
    location /_nuxt/ {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        # Hashed filenames allow aggressive caching (1 year)
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- PWA Icons & Splash Screens ----------
    location /icons/ {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- Static Images & Fonts ----------
    location ~* \.(png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot|otf|ico)$ {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- All Other Routes (SSR Pages) ----------
    location / {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_pwa;

        # SSR pages should not be cached — allow SW to control offline behavior
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- Error Pages ----------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
