# =============================================================================
# KF Maction v2.0 — Web Portal (Nuxt 4 SSR)
# =============================================================================
# Domain: admin.maction.kimiafarma.co.id
# Upstream: maction_portal (127.0.0.1:3001)
# Features: SSL, HTTP/2, static asset caching, gzip
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.maction.kimiafarma.co.id;

    # ---------- SSL Certificates ----------
    # REPLACE: Update paths to your actual Let's Encrypt or ACM certificates
    ssl_certificate /etc/letsencrypt/live/admin.maction.kimiafarma.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.maction.kimiafarma.co.id/privkey.pem;

    include /etc/nginx/snippets/maction/ssl-params.conf;

    # ---------- Security Headers ----------
    include /etc/nginx/snippets/maction/security-headers.conf;

    # ---------- Static Assets (Nuxt _nuxt/ build output) ----------
    # Long-lived cache for hashed filenames — safe to cache aggressively
    location /_nuxt/ {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_portal;

        # Hashed filenames allow aggressive caching (1 year)
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- Favicon & Manifest ----------
    location ~* \.(ico|webmanifest|json)$ {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_portal;

        add_header Cache-Control "public, max-age=86400";
    }

    # ---------- Static Images & Fonts ----------
    location ~* \.(png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot|otf)$ {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_portal;

        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- All Other Routes (SSR Pages) ----------
    location / {
        include /etc/nginx/snippets/maction/proxy-params.conf;
        proxy_pass http://maction_portal;

        # SSR pages should not be cached by CDN/browser
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- Error Pages ----------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
